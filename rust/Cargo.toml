[package]
name = "tta"
version = "0.1.0"
edition = "2021"
description = "Through the Ages (base 2015) engine — native Rust rewrite"
publish = false

# DELIBERATELY EMPTY.  See DESIGN.md rule 2: the card data lives baked into
# `src/card_table.rs`, checked in, so the engine parses no JSON, allocates
# nothing at start-up, and pulls in no serde.  (`card_table.rs`'s own test
# module still parses `data/*.json` at TEST time, via the hand-rolled reader
# in `src/fixtures.rs` -- not a `[dependencies]` entry either.)  A dependency
# here is a decision, not a convenience -- justify it in the commit.
[dependencies]

# Mechanical enforcement of "no wildcard `_ =>` arms over an enum": the rule
# used to live only in prompts/conventions, and a violation shipped anyway
# (rust/src/bots/weighted/cards.rs priced two event cards to literally
# nothing because their `Special` variants were swallowed by a trailing
# `_ => {}`). `wildcard_enum_match_arm` makes "add a new enum variant" a
# COMPILE ERROR at every match that must account for it, instead of a silent
# no-op. The two siblings close related gaps: `match_wildcard_for_single_
# variants` catches a wildcard used where only one variant is actually
# missing (clippy's more common accidental case), and `wildcard_in_or_
# patterns` catches the same swallow hiding inside an `A | B | _` arm rather
# than a bare trailing arm.
[lints.clippy]
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
wildcard_in_or_patterns = "deny"

# This file is ALSO the workspace root (a package manifest can be both --
# ordinary Cargo layout, not a virtual workspace). `trainer/` is the one
# authorised exception to the empty-`[dependencies]` rule above: GPU training
# on a real ML crate (candle), Paul's explicit decision 2026-08-06 -- see
# DESIGN.md's "GPU training: the one dependency exception" section for the
# reasoning. It takes a path dependency on THIS package rather than folding
# into it, specifically so that rule stays enforceable here: `cargo test` (no
# `-p`/`--workspace`) run from this directory builds and tests only the `tta`
# package the way it always has, pulling in none of `trainer`'s dependencies
# -- Cargo's default-package behaviour when invoked inside a workspace
# member's own directory, not something this file has to opt into.
[workspace]
members = ["trainer", "ttawasm"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Self-play is the benchmark, and it is dominated by state clones and by
# `legal_moves`.  Both are inlining-sensitive across module boundaries, which
# is what `lto = "fat"` plus a single codegen unit are here for; measure before
# relaxing either.
#
# Two further compiler levers were measured 2026-08-10 on a quiet box, same
# fixed 2400-game arena, best of three runs:
#   `-C target-cpu=native` (this box has AVX2/BMI2/FMA):  43.7s vs 43.4s
#       -- no effect, and not a surprise in hindsight: this is branchy
#       game-tree code walking small structs, with nothing to vectorise.
#       Deliberately NOT adopted; do not re-try it without new evidence.
#   PGO:                                                  38.4s vs 43.4s
#       -- ~11%, the only lever that moved, because its win is block layout
#       and inlining decisions rather than wider arithmetic. Adopted, but as
#       `tools/build_climb_pgo.sh` rather than a setting here: Cargo cannot
#       scope rustflags to one profile on stable, and `-Cprofile-use` applied
#       to every build (tests included) is not what is wanted.

[profile.bench]
inherits = "release"

# Debug assertions stay ON in this test profile (named `difftest` from when
# the whole suite was differential tests against the Python engine; the name
# stuck after that corpus was retired because this is still the everyday fast
# test path): the safety net an assertion provides only works if it can fire,
# and an invariant compiled out is an invariant that cannot fire. LTO and
# codegen-units are
# relaxed here relative to [profile.release]: this profile is the test path,
# not the self-play benchmark that `lto = "fat"`/`codegen-units = 1` are
# justified for. An earlier measurement on the OLD 16-separate-binaries
# layout found relaxing LTO made no difference (120s vs 120s either way):
# with 16 binaries on 6 cores the machine was codegen-bound regardless of
# link settings. That result does not carry over now that `tests/` builds
# as a single `suite` binary and the link is squarely on the critical path.
# Measured on this box, single `tests/suite` binary, warm dependency cache
# (`cargo test --release` vs `cargo test --profile difftest`):
#   cold `--no-run`:                          72s  -> 24s
#   incremental `--no-run` (touch one file):  77s  -> 24s
#   end-to-end incremental (build + run):     85s  -> 42s
# `cargo test --profile difftest` is the fast path for everyday test runs;
# `cargo test --release` still exists and still passes identically.
[profile.difftest]
inherits = "release"
debug-assertions = true
lto = false
codegen-units = 16
# Incremental compilation caches per-codegen-unit object code, so an edit
# re-codegens only the units it actually touched -- the closest thing Rust has
# to C's "recompile one .o and relink", and worth having precisely because this
# crate has no external dependencies: there is nothing else in the build to
# cache. It is off in [profile.release] (Cargo's default there) and stays off:
# `lto = "fat"` plus `codegen-units = 1` means a single unit, so there would be
# nothing to reuse anyway.
#
# Measured on this box 2026-08-07, cold clone, `--bin replaystats`, while other
# builds were competing for cores (i.e. the realistic case, not a quiet box):
#   cold build, [profile.release]:                   198s
#   cold build, [profile.difftest] without this:      49s
#   rebuild after a real edit, without this:          74s
#   rebuild after a real edit, with this:          28-36s
# The corpus output is byte-identical between profiles, and `replaystats` over
# all 1011 journals actually runs slightly FASTER from difftest than release
# (5.1s vs 6.7s), so there is no reason for analysis tooling to pay the release
# link at all. Build the engine with `--release` when you are measuring
# self-play strength; build the replay/analysis binaries with
# `--profile difftest`.
incremental = true

# The everyday edit-test cycle, and ONLY that. `difftest` above inherits
# `opt-level = 3` from release, which is right for the analysis binaries (they
# chew through 1011 journals) and badly wrong for `cargo test`, where the test
# bodies are tiny and the optimiser is pure overhead. Measured on this box
# 2026-08-14, warm target dir, after ONE real semantic edit inside
# `effects::compute` (a `touch` measures nothing -- rustc content-hashes, so a
# mtime-only change rebuilds in ~10s at any opt-level):
#                          opt  cgu   compile   run   total
#   [profile.difftest]       3   16     111.9    4.1   116.0
#                            1   16      97.2    4.4   101.6
#                            0   16      22.1   34.3    56.4
#   [profile.fasttest]       0  256      13.2   33.2    46.4
# `debug = 0` was tried on top and is a verified no-op: this profile already
# emits `-C strip=debuginfo`.
#
# This is deliberately a SEPARATE profile rather than a change to `difftest`,
# because the two have opposite needs and one compromise serves neither.
# `replaystats` over all 1011 journals takes 8.7s at opt-level 3 and 46.7s at
# opt-level 0 -- same 310 completed, same 281 exact, 5.4x the wall clock. The
# corpus replay being nearly free is what makes the regression guard in
# analysis/GUARD_METHOD.txt cheap enough to run every time, so it keeps
# opt-level 3.
#
# The split costs a second copy of the library in target/ and, for a worker
# that compiles exactly once, is a net loss (46.4 + 111.9 to then build
# replaystats, vs 116.0 + 8.7). It pays from the second test run onward, which
# is every real debugging session. Use `cargo test --profile fasttest` while
# iterating; use `--profile difftest` for the analysis binaries and the corpus
# guard.
[profile.fasttest]
inherits = "difftest"
opt-level = 0
codegen-units = 256

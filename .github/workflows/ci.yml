name: CI

# Mechanical enforcement for the Rust engine (rust/): the project bans
# wildcard `_ =>` arms over an enum (see rust/Cargo.toml's [lints.clippy] --
# `wildcard_enum_match_arm` and its two siblings are `deny`d there) so that
# adding a new enum variant is a COMPILE ERROR everywhere it must be
# accounted for, instead of a silently-swallowed no-op. Until this workflow
# existed that rule was enforced only by convention in prompts, and a
# violation shipped anyway (rust/src/bots/weighted/cards.rs's card_yields).
# This is the mechanical backstop: nothing runs clippy or the test suite
# automatically without it.
#
# Deliberately minimal: no secrets, no deploy step, no network fetch beyond
# the toolchain update below.
#
# This runs on GitHub-hosted runners, which are free and unmetered for public
# repositories. Never point it at a self-hosted runner: a self-hosted runner
# executes whatever a workflow file says, as the login that registered it, and
# on a public repo any fork's pull request can supply that workflow.
#
# The BGO corpus under `sources/` is NOT part of this repository (it is
# third-party material and real players' account names, kept privately in
# ptarjan/tta-ai-sources). Anything here that needs it must skip when it is
# absent, because CI never has it.

on:
  push:
  pull_request:

# Superseding a run instead of queueing it keeps a push burst from stacking
# builds that are already obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        # Cargo commands run from rust/, never the repo root -- this crate's
        # own convention (see rust/Cargo.toml's doc comment on [workspace]):
        # `cargo test`/`cargo clippy` invoked here builds and tests only the
        # `tta` package, not `trainer`'s candle/GPU dependency tree.
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      # The gate runs the LATEST stable clippy, which catches lints an older
      # pinned toolchain cannot see. Select it explicitly with `+stable` rather
      # than `rustup default`, so the same workflow behaves identically wherever
      # it runs.
      - name: Update the stable toolchain
        run: |
          rustup update stable --no-self-update
          rustup component add clippy --toolchain stable
          cargo +stable --version

      - name: cargo clippy (all targets, warnings deny)
        run: |
          cargo +stable clippy --all-targets -- -D warnings

      - name: cargo test
        run: |
          cargo +stable test

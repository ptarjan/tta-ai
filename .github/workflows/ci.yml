name: CI

# Mechanical enforcement for the Rust engine (rust/): the project bans
# wildcard `_ =>` arms over an enum (see rust/Cargo.toml's [lints.clippy] --
# `wildcard_enum_match_arm` and its two siblings are `deny`d there) so that
# adding a new enum variant is a COMPILE ERROR everywhere it must be
# accounted for, instead of a silently-swallowed no-op. Until this workflow
# existed that rule was enforced only by convention in prompts, and a
# violation shipped anyway (rust/src/bots/weighted/cards.rs's card_yields).
# This is the mechanical backstop: nothing runs clippy or the test suite
# automatically without it.
#
# Deliberately minimal: no secrets, no deploy step, no network fetch beyond
# the toolchain update below.
#
# This runs on a SELF-HOSTED runner (the mac mini, `actions-runner-tta/`),
# not a GitHub-hosted one: this repo is private, so hosted minutes are
# metered, and every run for a week was killed before its first step. Self-
# hosted minutes are free. The repo must stay private for that to be safe --
# a self-hosted runner executes whatever a workflow says, and this one runs
# as the `pt` login with that account's full access.

on:
  push:
  pull_request:

# One machine, shared with the training league. Superseding a run instead of
# queueing it keeps a push burst from stacking builds against the climb.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    defaults:
      run:
        # Cargo commands run from rust/, never the repo root -- this crate's
        # own convention (see rust/Cargo.toml's doc comment on [workspace]):
        # `cargo test`/`cargo clippy` invoked here builds and tests only the
        # `tta` package, not `trainer`'s candle/GPU dependency tree.
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      # The whole point of the gate is that it runs the LATEST stable clippy,
      # which has caught lints the box's older toolchain could not see. But
      # this box also builds the league binaries, so the toolchain step must
      # update the `stable` CHANNEL and select it explicitly with `+stable` --
      # never `rustup default`, which would repoint every other build here.
      # `$HOME/.cargo/bin` is not on a launchd service's PATH.
      - name: Update the stable toolchain
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup update stable --no-self-update
          rustup component add clippy --toolchain stable
          cargo +stable --version

      - name: cargo clippy (all targets, warnings deny)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo +stable clippy --all-targets -- -D warnings

      - name: cargo test
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo +stable test

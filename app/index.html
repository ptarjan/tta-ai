<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TTA Advisor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="fakeBanner" class="banner hidden">ADVICE IS FAKE — wasm engine not loaded, showing stub moves only</div>

<header id="topbar">
  <div class="brand">TTA Advisor</div>
  <div class="stats" id="stats">round – · age – · CA – MA – food – res – sci –</div>
  <div class="topbtns">
    <button id="handToggleBtn" class="btn small">Hand</button>
    <button id="undoBtn" class="btn small">Undo</button>
    <button id="newGameBtn" class="btn small danger">New game</button>
  </div>
</header>

<main id="stepArea"></main>

<div id="handPanel" class="handPanel hidden">
  <div class="sectionTitle">Your hand (tap = mark played)</div>
  <div id="handChips" class="chips"></div>
  <button id="handCloseBtn" class="btn small">Close</button>
</div>

<script src="app.js"></script>
</body>
</html>

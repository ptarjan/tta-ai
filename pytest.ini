[pytest]
# The suite is CPU-bound self-play, and it ran for fifteen minutes serially on
# a box that also has eight league arms on it.  A fifteen-minute check is a tax
# on every fix, and it is the reason a change sits unverified for half an hour
# before it can land, so parallel is the DEFAULT here rather than something you
# have to remember to type.
#
#   -n logical      one worker per logical core.  `auto` counts physical cores;
#                   these tests block on nothing, so logical is the right one.
#   --dist loadfile all tests in a file go to the SAME worker.  That is not a
#                   fairness knob -- tests/corpus.py caches played games per
#                   PROCESS, so splitting a file across workers would replay
#                   the same game in each of them and undo the caching.
#
# Override for a single run with `-p no:xdist` or `-n0` when a failure needs a
# clean traceback, or when you are debugging with `-s`.
addopts = -q -n logical --dist loadfile
testpaths = tests
